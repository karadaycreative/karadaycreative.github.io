<title>Kara Day — BRB</title>
<style>
  :root {
    --bg: #efeae2;
    --bg-vignette: #e6e0d5;
    --ink: #231f20;
    --muted: #a39c92;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17;
      --bg-vignette: #232019;
      --ink: #f3eee6;
      --muted: #8b857c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1a17;
    --bg-vignette: #232019;
    --ink: #f3eee6;
    --muted: #8b857c;
  }

  @font-face {
    font-family: "Fraunces";
    src: local("Fraunces");
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 45%, var(--bg-vignette) 0%, var(--bg) 60%);
    color: var(--ink);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.5rem, 4vw, 2.75rem);
    padding: 2rem;
    text-align: center;
  }

  .logo {
    width: clamp(190px, 34vw, 320px);
    height: auto;
    display: block;
  }

  .logo path {
    fill: var(--ink);
  }

  .brb {
    font-family: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-optical-sizing: auto;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0;
    animation: breathe 4.5s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .brb { animation: none; }
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }
</style>
